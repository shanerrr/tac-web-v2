name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Read-only Delivery API credentials; the build fetches the content.
  CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
  CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Check the deploy as Wrangler would (no upload)
        run: bunx wrangler deploy --dry-run

      # Serves the built files the way Cloudflare's static assets do, redirects and 404s included.
      - name: Smoke test the built site
        run: |
          bunx wrangler dev --port 8787 > wrangler.log 2>&1 &
          fail() { echo "::error::$1"; cat wrangler.log; exit 1; }
          for i in $(seq 1 60); do curl -fs -o /dev/null --max-time 5 http://localhost:8787/ && break; sleep 1; done
          curl -fsS --max-time 30 http://localhost:8787/ -o home.html || fail "Home page did not return 200"
          grep -q '<title>The Age Collective' home.html || fail "Home page rendered without its title"
          grep -q 'images.ctfassets.net' home.html || fail "Home page has no stories from Contentful"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/films)" = 301 || fail "/films no longer redirects"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/no-such-page)" = 404 || fail "Unknown pages do not return 404"

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Build and deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Set the PRODUCTION_URL variable (the workers.dev URL until the domain moves) to check the live site.
      - name: Check the live site
        if: vars.PRODUCTION_URL != ''
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "${{ vars.PRODUCTION_URL }}/" -o home.html
          grep -q '<title>The Age Collective' home.html
